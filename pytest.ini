[pytest]
testpaths = tests
pythonpath = src
python_files = test_*.py
addopts = --strict-markers
markers =
    unit: isolated framework behavior without browsers or network services
    integration: collaborating framework components or a real local browser
    example: application UI examples, separate from framework capability tests
    smoke: fast checks for core behavior and framework readiness
    regression: broader regression coverage
    e2e: end-to-end user journeys across multiple functional boundaries
    ui: browser-based UI tests
    slow: slower tests that may be excluded from quick local runs
