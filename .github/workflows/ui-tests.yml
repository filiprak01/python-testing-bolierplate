name: Public Selenium smoke

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite
        required: true
        default: smoke
        type: choice
        options: [smoke, local, all]

permissions:
  contents: read

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pip dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-build-isolation -e .
      - name: Run the selected suite
        shell: bash
        env:
          SUITE: ${{ inputs.suite || 'smoke' }}
        run: |
          set -euo pipefail
          args=(--run-ui --headless --alluredir=allure-results)
          case "$SUITE" in
            smoke) python -m pytest -m "example and smoke" "${args[@]}" ;;
            local) python -m pytest -m "integration and ui" "${args[@]}" ;;
            all) python -m pytest "${args[@]}" ;;
            *) echo "Unknown suite: $SUITE"; exit 1 ;;
          esac
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-allure-${{ github.run_number }}
          path: |
            allure-report/
            allure-results/
            screenshots/
            logs/
          if-no-files-found: warn
