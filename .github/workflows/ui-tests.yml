name: Public Selenium smoke

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite
        required: true
        default: smoke
        type: choice
        options: [smoke, local, all]

permissions:
  contents: read

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install tools and locked dependencies
        run: |
          python -m pip install poetry==2.3.0
          poetry install --no-interaction
          npm install --global allure-commandline@2.43.0
      - name: Run the selected suite
        shell: bash
        env:
          SUITE: ${{ inputs.suite || 'smoke' }}
        run: |
          set -euo pipefail
          args=(--run-ui --headless --alluredir=allure-results)
          case "$SUITE" in
            smoke) poetry run pytest tests/examples "${args[@]}" ;;
            local) poetry run pytest tests/integration/test_local_browser.py "${args[@]}" ;;
            all) poetry run pytest "${args[@]}" ;;
            *) echo "Unknown suite: $SUITE"; exit 1 ;;
          esac
      - name: Generate Allure report
        if: ${{ always() && hashFiles('allure-results/**') != '' }}
        run: allure generate allure-results --clean --output allure-report
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-allure-${{ github.run_number }}
          path: |
            allure-report/
            allure-results/
            screenshots/
            logs/
          if-no-files-found: warn
