name: Framework baseline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Poetry and locked dependencies
        run: |
          python -m pip install poetry==2.3.0
          poetry install --no-interaction
      - name: Check metadata and Python quality
        run: |
          poetry check --lock
          poetry run ruff check src tests
          poetry run ruff format --check src tests
      - name: Run unit tests
        run: poetry run pytest tests/unit --junitxml=test-results/unit.xml -q
      - name: Run framework integration tests with real headless Chrome
        run: poetry run pytest tests/integration --run-ui --headless --alluredir=allure-results --junitxml=test-results/integration.xml -q
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-${{ matrix.os }}-${{ github.run_number }}
          path: |
            test-results/
            allure-results/
            screenshots/
            logs/
          if-no-files-found: warn
