name: Framework baseline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev, prep/pip-native-linux]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            profile: reference
          - os: windows-latest
            profile: reference
          - os: ubuntu-latest
            profile: compatible
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pip dependencies
        if: matrix.profile == 'reference'
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-build-isolation -e .
      - name: Install older compatible dependencies
        if: matrix.profile == 'compatible'
        run: |
          python -m pip install -r requirements-compatible.txt "setuptools>=69" wheel ruff==0.16.3
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Report environment without changing it
        run: python scripts/environment_probe.py
      - name: Check metadata and Python quality
        run: |
          python -m pip check
          python -m ruff check src tests scripts
          python -m ruff format --check src tests scripts
          python -m pip wheel --no-build-isolation --no-deps . --wheel-dir dist
      - name: Run unit tests
        run: python -m pytest -m unit --junitxml=test-results/unit.xml -q
      - name: Run framework integration tests with real headless Chrome
        run: python -m pytest -m integration --run-ui --headless --alluredir=allure-results --junitxml=test-results/integration.xml -q
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-${{ matrix.os }}-${{ matrix.profile }}-${{ github.run_number }}
          path: |
            test-results/
            allure-results/
            screenshots/
            logs/
          if-no-files-found: warn
