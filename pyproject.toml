[project]
name = "python-testing-boilerplate"
version = "0.1.0"
description = "A Python testing foundation with Selenium, pytest, and Allure evidence."
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "selenium>=4.27.1,<5.0.0",
    "pytest>=8.3.4,<10.0.0",
    "allure-pytest>=2.13.5,<3.0.0",
    "PyYAML>=6.0.2,<7.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["project"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "allure-results", "allure-report"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "ARG", "PT", "RUF", "ANN"]
ignore = ["ANN401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
